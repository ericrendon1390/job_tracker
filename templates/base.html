
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Application Tracker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <h2>Job Tracker</h2>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('list_records', table='companies') }}">Companies</a>
        <a href="{{ url_for('list_records', table='jobs') }}">Jobs</a>
        <a href="{{ url_for('list_records', table='applications') }}">Applications</a>
        <a href="{{ url_for('list_records', table='contacts') }}">Contacts</a>
        <a href="{{ url_for('job_match') }}">Job Match</a>
    </nav>

    <main>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
